# SPDX-License-Identifier: MPL-2.0
# This workflow is managed by gh actions-lock.
# Instant Forge Sync - Triggers propagation to all forges on push/release
#
# STATE: DISABLED at the repository settings level (Settings → Actions →
# Workflows), so it never runs on pushes or releases even though the triggers
# below are still declared. Repository-level workflow disabling is not visible
# from the repository contents, so it is recorded here.
#
# It is kept in the tree because the propagation mechanism is still the
# intended distribution path for the estate (see mirror.yml, which publishes to
# one mirror). Re-enable only with a `FARM_DISPATCH_TOKEN` secret present on the
# destination farm; without the secret the credential check below no-ops with a
# notice, so re-enabling before the secret exists is safe but useless.
name: Instant Sync
on:
  push:
    branches: [main, master]
  release:
    types: [published]
permissions:
  contents: read
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check propagation credential presence
        id: credential
        env:
          FARM_DISPATCH_TOKEN: ${{ secrets.FARM_DISPATCH_TOKEN }}
        run: |
          if [ -n "$FARM_DISPATCH_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::FARM_DISPATCH_TOKEN is unavailable; propagation is skipped"
          fi
      - name: Trigger Propagation
        if: steps.credential.outputs.available == 'true'
        uses: peter-evans/repository-dispatch@v4.0.1
        with:
          token: ${{ secrets.FARM_DISPATCH_TOKEN }}
          repository: hyperpolymath/.git-private-farm
          event-type: propagate
          client-payload: |-
            {
              "repo": "${{ github.event.repository.name }}",
              "ref": "${{ github.ref }}",
              "sha": "${{ github.sha }}",
              "forges": ""
            }
      - name: Confirm
        if: steps.credential.outputs.available == 'true'
        run: echo "::notice::Propagation triggered for ${{ github.event.repository.name }}"
