# OikosBot - Continuous Integration

name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions: read-all
jobs:
  haskell:
    name: Haskell Analyzer
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Setup Haskell
        uses: haskell-actions/setup@v2.12.1
        with:
          ghc-version: "9.4"
          cabal-version: "3.10"
      - name: Cache Cabal
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cabal/packages
            ~/.cabal/store
            analyzers/code-haskell/dist-newstyle
          key: cabal-${{ runner.os }}-ghc9.4-${{ hashFiles('analyzers/code-haskell/oikos-analyzer.cabal') }}
      - name: Build Haskell analyzer
        working-directory: analyzers/code-haskell
        run: |
          cabal update
          cabal build all
      - name: Test Haskell analyzer
        working-directory: analyzers/code-haskell
        run: cabal test all
  rust:
    name: Rust Workspace
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Cache cargo
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      # rustup honors rust-toolchain.toml; no third-party toolchain action.
      # NB: the default workspace deliberately EXCLUDES crates/oikosbot-fleet so
      # OikosBot builds with no dependency on hyperpolymath/gitbot-fleet.
      - name: Format check
        run: cargo fmt --check
      - name: Build (standalone workspace)
        run: cargo build --workspace --locked
      - name: Test default standalone workspace
        run: cargo test --workspace --locked
      - name: Test all retained features
        run: cargo test --workspace --all-features --locked
      - name: Eclexia adapter feature and rejection checks
        run: bash tests/test-eclexia-adapter.sh
      - name: Clippy (informational)
        run: cargo clippy --workspace
        continue-on-error: true
  affine:
    name: AffineScript Scaffold
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Composite Action argument contract
        run: bash tests/test-action-arguments.sh
      - name: Check shell wrapper syntax
        run: bash -n bot-integration-affine/check.sh
  security:
    name: Security Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          severity: "CRITICAL,HIGH"
          format: "sarif"
          output: "trivy-results.sarif"
        continue-on-error: true
      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v4.38.1
        with:
          sarif_file: "trivy-results.sarif"
        continue-on-error: true
  container-contract:
    name: Container smoke contract
    needs: rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Build candidate
        run: docker build -f Containerfile -t oikosbot:verify .
      - name: Paired clean and firing fixtures, version and non-root execution
        run: bash tests/test-container-contract.sh oikosbot:verify
