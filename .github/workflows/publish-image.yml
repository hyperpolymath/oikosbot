#
# Publish the OikosBot CLI image to GHCR as ghcr.io/hyperpolymath/oikos so the
# "oikos" package links back to this repo via the org.opencontainers.image.source
# label injected by metadata-action. NB the image/package name is "oikos" while
# the binary and repo are "oikosbot" — the mismatch is intentional.
name: Publish Image
on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Containerfile'
      - '.dockerignore'
      - '.github/workflows/publish-image.yml'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build-push:
    name: Build and push oikos image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0
      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/hyperpolymath/oikos
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha
      - name: Build and push
        id: push
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: ./Containerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Attest container provenance
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-name: ghcr.io/hyperpolymath/oikos
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
