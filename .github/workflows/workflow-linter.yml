# SPDX-License-Identifier: MPL-2.0
# This workflow is managed by gh actions-lock.
# Prevention workflow - validates all workflows have proper security config
name: Workflow Security Linter
on:
  pull_request:
    paths:
      - '.github/workflows/**'
  push:
    paths:
      - '.github/workflows/**'
permissions: read-all
jobs:
  lint-workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check SPDX headers
        run: |
          errors=0
          for f in .github/workflows/*.yml .github/workflows/*.yaml; do
            [ -f "$f" ] || continue
            if ! head -1 "$f" | grep -q "SPDX-License-Identifier"; then
              echo "ERROR: $f missing SPDX header"
              errors=$((errors + 1))
            fi
          done
          exit $errors
      - name: Check permissions declaration
        run: |
          errors=0
          for f in .github/workflows/*.yml .github/workflows/*.yaml; do
            [ -f "$f" ] || continue
            if ! grep -q "^permissions:" "$f"; then
              echo "ERROR: $f missing permissions declaration"
              errors=$((errors + 1))
            fi
          done
          exit $errors
      # GitHub's actions.lock runtime resolves refs to the verified commits in
      # the lockfile. A workflow may therefore retain a readable release ref;
      # demanding an inline SHA as well contradicts the lockfile model and made
      # this job reject every onboarded workflow. Check lockfile coverage here;
      # GitHub verifies reachability and repository identity at runtime.
      - name: Check actions lockfile coverage
        run: |
          set -uo pipefail
          errors=0
          lockfile=.github/workflows/actions.lock
          [ -f "$lockfile" ] || { echo "missing $lockfile"; exit 1; }
          files=$(find .github/workflows examples -maxdepth 1 \
                    \( -name '*.yml' -o -name '*.yaml' \) 2>/dev/null || true)
          [ -n "$files" ] || { echo "no workflow files found"; exit 1; }

          for f in $files; do
            while IFS= read -r ref; do
              [ -n "$ref" ] || continue
              repo=${ref%@*}; sha=${ref#*@}
              repo=$(echo "$repo" | cut -d/ -f1,2)
              key="$repo@$sha"

              if grep -Fq "    '$key':" "$lockfile"; then
                continue
              fi

              # Reusable workflows already pinned inline, and examples (which
              # cannot be onboarded into this lockfile), remain acceptable with
              # a full SHA. GitHub proves executable SHAs during resolution;
              # avoiding an API probe here also avoids rate-limit/DNS failures.
              if [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
                continue
              fi

              echo "ERROR: $f uses $ref without actions.lock coverage"
              errors=$((errors + 1))
            done < <(grep -oE 'uses: +[A-Za-z0-9._/-]+@[A-Za-z0-9._-]+' "$f" \
                     | sed 's/uses: *//' | tr -d '\r' || true)
          done

          if [ "$errors" -gt 0 ]; then
            echo "::error::$errors action reference(s) missing lockfile coverage"
          else
            echo "all executable action refs are covered by actions.lock"
          fi
          exit $errors
