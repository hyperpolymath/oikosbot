# This workflow is managed by gh actions-lock.
# SPDX-License-Identifier: MPL-2.0
# Prevention workflow - validates all workflows have proper security config
name: Workflow Security Linter
on:
  pull_request:
    paths:
      - '.github/workflows/**'
  push:
    paths:
      - '.github/workflows/**'
permissions: read-all
jobs:
  lint-workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check SPDX headers
        run: |
          errors=0
          for f in .github/workflows/*.yml .github/workflows/*.yaml; do
            [ -f "$f" ] || continue
            if ! head -1 "$f" | grep -q "SPDX-License-Identifier"; then
              echo "ERROR: $f missing SPDX header"
              errors=$((errors + 1))
            fi
          done
          exit $errors
      - name: Check permissions declaration
        run: |
          errors=0
          for f in .github/workflows/*.yml .github/workflows/*.yaml; do
            [ -f "$f" ] || continue
            if ! grep -q "^permissions:" "$f"; then
              echo "ERROR: $f missing permissions declaration"
              errors=$((errors + 1))
            fi
          done
          exit $errors
      # GitHub's actions.lock runtime resolves refs to the verified commits in
      # the lockfile. A workflow may therefore retain a readable release ref;
      # demanding an inline SHA as well contradicts the lockfile model and made
      # this job reject every onboarded workflow. Check lockfile coverage here;
      # GitHub verifies reachability and repository identity at runtime.
      - name: Check actions lockfile coverage
        run: |
          set -euo pipefail
          lockfile=.github/workflows/actions.lock
          [ -f "$lockfile" ] || { echo "missing $lockfile"; exit 1; }
          mapfile -t files < <(find .github/workflows examples -maxdepth 1 \
                    \( -name '*.yml' -o -name '*.yaml' \) 2>/dev/null)
          [ "${#files[@]}" -gt 0 ] || { echo "no workflow files found"; exit 1; }
          python3 - "$lockfile" "${files[@]}" <<'PY'
          import re
          import sys
          import yaml

          lock_path, *workflow_paths = sys.argv[1:]
          with open(lock_path, encoding="utf-8") as stream:
              lock = yaml.safe_load(stream)
          dependencies = (lock or {}).get("dependencies", {})
          if not isinstance(dependencies, dict):
              raise SystemExit(f"{lock_path}: dependencies must be a mapping")

          errors = []

          def check_node(node, path):
              if isinstance(node, dict):
                  for key, value in node.items():
                      if key == "uses":
                          if not isinstance(value, str):
                              errors.append(f"ERROR: {path} has a non-string uses value")
                          else:
                              check_ref(value.strip(), path)
                      check_node(value, path)
              elif isinstance(node, list):
                  for value in node:
                      check_node(value, path)

          def check_ref(ref, path):
              if ref.startswith("./") or ref.startswith("docker://"):
                  return
              if "@" not in ref:
                  errors.append(f"ERROR: {path} has malformed action reference {ref}")
                  return
              target, revision = ref.rsplit("@", 1)
              repository = "/".join(target.split("/")[:2])
              lock_key = f"{repository}@{revision}"
              if lock_key in dependencies or re.fullmatch(r"[0-9a-f]{40}", revision):
                  return
              errors.append(f"ERROR: {path} uses {ref} without actions.lock coverage")

          for path in workflow_paths:
              with open(path, encoding="utf-8") as stream:
                  check_node(yaml.safe_load(stream), path)

          if errors:
              print("\n".join(errors))
              raise SystemExit(f"::error::{len(errors)} action reference(s) missing lockfile coverage")
          print("all executable action refs are covered by parsed actions.lock data")
          PY
