# SPDX-License-Identifier: MPL-2.0
# Prevention workflow - validates all workflows have proper security config
name: Workflow Security Linter
on:
  pull_request:
    paths:
      - '.github/workflows/**'
  push:
    paths:
      - '.github/workflows/**'
permissions: read-all
jobs:
  lint-workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Check SPDX headers
        run: |
          errors=0
          for f in .github/workflows/*.yml .github/workflows/*.yaml; do
            [ -f "$f" ] || continue
            if ! head -1 "$f" | grep -q "SPDX-License-Identifier"; then
              echo "ERROR: $f missing SPDX header"
              errors=$((errors + 1))
            fi
          done
          exit $errors
      - name: Check permissions declaration
        run: |
          errors=0
          for f in .github/workflows/*.yml .github/workflows/*.yaml; do
            [ -f "$f" ] || continue
            if ! grep -q "^permissions:" "$f"; then
              echo "ERROR: $f missing permissions declaration"
              errors=$((errors + 1))
            fi
          done
          exit $errors
      # This step used to set errors=0, only echo a WARNING (never
      # incrementing), and end without `exit $errors` — so it could not fail
      # on any input. It also globbed only .github/workflows, so the dead pin
      # in examples/oikosbot-ci.yml was structurally invisible. Both are
      # fixed below, and the check now probes whether each SHA *exists*
      # rather than merely matching its shape: a 40-hex string that is not a
      # real commit resolves to nothing, kills the job in "Set up job", and
      # produces no check run at all — the failure mode that reads as green.
      - name: Check pinned actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          errors=0
          files=$(find .github/workflows examples -maxdepth 1 \
                    \( -name '*.yml' -o -name '*.yaml' \) 2>/dev/null || true)
          [ -n "$files" ] || { echo "no workflow files found"; exit 1; }

          for f in $files; do
            # Unpinned: a tag or branch ref instead of a 40-hex SHA.
            while IFS= read -r ref; do
              [ -n "$ref" ] || continue
              echo "ERROR: $f pins '$ref' by tag/branch, not by SHA"
              errors=$((errors + 1))
            done < <(grep -oE 'uses: +[A-Za-z0-9._/-]+@[A-Za-z0-9._-]+' "$f" \
                     | sed 's/uses: *//' \
                     | grep -vE '@[0-9a-f]{40}$' || true)

            # Pinned but phantom: the SHA is not a commit in that repo.
            while IFS= read -r ref; do
              [ -n "$ref" ] || continue
              repo=${ref%@*}; sha=${ref#*@}
              # owner/repo/subpath@sha -> owner/repo
              repo=$(echo "$repo" | cut -d/ -f1,2)
              if ! gh api "repos/$repo/commits/$sha" --jq .sha >/dev/null 2>&1; then
                echo "ERROR: $f pins $repo@$sha — no such commit (phantom SHA)"
                errors=$((errors + 1))
              fi
            done < <(grep -oE 'uses: +[A-Za-z0-9._/-]+@[0-9a-f]{40}' "$f" \
                     | sed 's/uses: *//' || true)
          done

          if [ "$errors" -gt 0 ]; then
            echo "::error::$errors unpinned or phantom action reference(s)"
          else
            echo "all action pins are SHA-pinned and resolve to real commits"
          fi
          exit $errors
