[package]
name = "oikosbot-eclexia"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Eclexia policy engine integration for oikosbot"

[features]
default = []
# Reserved native integration feature. Enabling it builds successfully but
# evaluation returns an explicit unavailable error until real dependencies,
# input binding, budgets, and the result protocol are integrated.
# The default builtin fallback does not parse or execute .ecl source.
eclexia-native = []

[dependencies]
oikosbot-metrics = { path = "../oikosbot-metrics" }
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
